name: Actualizar lista M3U
on:
  workflow_dispatch:
  push:
    paths:
      - Actualizar.ps1
      - .github/workflows/actualizar.yml
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: actualizar-m3u
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar JSON y generar listas
        shell: pwsh
        run: ./Actualizar.ps1
      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canales.m3u catalogo_con_drm.m3u informe.csv estado.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar canales desde MonchoApps'
            git push
          fi
